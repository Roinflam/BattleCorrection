plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "${rootProject.mod_id}.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // 这里的依赖会打进最终 jar
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Cloth Config：配置界面，以 jar-in-jar 内嵌
    modApi "me.shedaniel.cloth:cloth-config-forge:11.1.136"
    include "me.shedaniel.cloth:cloth-config-forge:11.1.136"

    // Curios：软依赖，只在编译时引用，没装也能运行
    // 饰品栏标记用到的接口是按 5.14.1 核对的
    modCompileOnly "top.theillusivec4.curios:curios-forge:5.14.1+1.20.1"

    // forge/dependencies/ 里的 jar 都会挂进来
    // 模组 jar（带 META-INF/mods.toml）必须用 modImplementation：
    // 正式版模组 jar 里的 Minecraft 类名/字段名是 SRG 混淆名（f_256982_ 这种），
    // 开发环境用的是 Mojang 官方名，Loom 只对 mod 开头的依赖做"SRG → 官方名"重映射；
    // 用普通 implementation 挂进来的模组不会被重映射，一初始化就 NoSuchFieldError。
    // 普通 Java 库（没有 mods.toml）不引用 Minecraft 类，直接 implementation 即可。
    fileTree(dir: 'dependencies', include: '*.jar').each { File file ->
        boolean isMod = new java.util.zip.ZipFile(file).withCloseable { zip ->
            zip.getEntry('META-INF/mods.toml') != null
        }
        if (isMod) {
            modImplementation files(file)
        } else {
            implementation files(file)
        }
    }
}

processResources {
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'mod_name', rootProject.mod_name
    inputs.property 'version', project.version
    inputs.property 'mod_author', rootProject.mod_author
    inputs.property 'mod_license', rootProject.mod_license
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'forge_loader_version', rootProject.forge_loader_version

    filesMatching('META-INF/mods.toml') {
        expand(
                'mod_id': rootProject.mod_id,
                'mod_name': rootProject.mod_name,
                'version': project.version,
                'mod_author': rootProject.mod_author,
                'mod_license': rootProject.mod_license,
                'minecraft_version': rootProject.minecraft_version,
                'forge_loader_version': rootProject.forge_loader_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
