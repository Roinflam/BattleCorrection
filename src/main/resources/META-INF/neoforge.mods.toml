modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_author}"
credits = "特别感谢 建议重开 为本项目提供的支持和帮助。内嵌 shedaniel 的 Cloth Config API（GNU LGPLv3），未作修改，以独立 jar-in-jar 形式提供配置界面。 / Cloth Config API by shedaniel (GNU LGPLv3) is bundled unmodified as a separate jar-in-jar for the config screen."
description = '''
战斗修正模组，提供各种
RPG 战斗增强功能
'''

# NeoForge 1.20.5 起 mixin 配置在这里登记，不再写进 jar 的 MANIFEST
[[mixins]]
config = "${mod_id}.mixins.json"

# ===== 必需依赖 =====

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# ===== 可选依赖 =====

# Cloth Config 以 jar-in-jar 内嵌，这条只为加载顺序：构造时就要注册配置界面，要它先加载。
# 设成 optional：万一整合包里内嵌的被剥掉或被别的版本顶替，也只是配置界面不可用，不会卡在缺前置。
[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "optional"
versionRange = "[${cloth_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "${curios_version_range}"
ordering = "AFTER"
side = "BOTH"
