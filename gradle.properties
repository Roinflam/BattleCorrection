org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# 模组 ID，发布后不要再改，否则存档里的物品会丢失
mod_id=battlecorrection
mod_name=BattleCorrection
# 与 1.20.1 分支共用版本号
mod_version=3.0.0
maven_group=pers.roinflam

mod_author=Roinflam
mod_license=CC BY-NC-SA 4.0

# Minecraft 与 NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
neo_version_range=[21.1.265,)
# FML 加载器版本（1.21.1 是 4.x）
loader_version_range=[4,)

# Cloth Config（配置界面，jar-in-jar 内嵌）
cloth_version=15.0.140

# Curios（可选联动）
curios_version=9.5.1+1.21.1
curios_version_range=[9.5.1,)
